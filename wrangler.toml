name = "dashboard-metrics-team"
pages_build_output_dir = "./dist"
compatibility_date = "2026-10-09"
# TCP para o Postgres (Azure) pelo driver "postgres"
compatibility_flags = ["nodejs_compat"]

# Cloudflare Access (Zero Trust): login por código enviado ao e-mail @ctctech.com.br.
# Não são segredos. A API valida o JWT do Access em QUALQUER endereço do projeto
# (inclusive os <hash>.radar-prevendas.pages.dev de cada deploy).
# Para reabrir o acesso temporariamente: adicionar ACESSO_PUBLICO = "true" (não recomendado).
[vars]
CF_ACCESS_TEAM_DOMAIN = "ctctech-radar.cloudflareaccess.com"
CF_ACCESS_AUD = "ef8c10001baa8332266db6f525b1bb2bf7239bc352c01c809682ae60ee22925f"

# Hyperdrive (opcional): conexões já abertas com o Postgres, para poupar a CPU de TLS e autenticação a cada requisição (plano gratuito do
# Workers: ~10 ms). Como este arquivo é a fonte da verdade do projeto, o binding entra AQUI (não no painel). Passo a passo em
# docs/OPERACAO.md (4.7). Crie a configuração no Cloudflare com a string do papel radar_leitor e então descomente, com o ID dela
# (o ID não é segredo). Sem isto o painel segue funcionando, direto pela DATABASE_URL.
# [[hyperdrive]]
# binding = "HYPERDRIVE"
# id = "<ID da configuração do Hyperdrive>"
