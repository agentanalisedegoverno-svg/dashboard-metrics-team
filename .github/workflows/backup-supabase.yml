name: Backup no Supabase

# Segunda cópia do banco (redundância): restaura o Neon, uma vez por dia, num Postgres do Supabase.
# O backup criptografado no Google Drive (backup-banco.yml) continua sendo o principal; este é um espelho pronto para uso.
# Também mantém o projeto do Supabase ativo (o plano gratuito pausa após 7 dias sem atividade): a restauração diária já é atividade
# e, se SUPABASE_URL e SUPABASE_ANON_KEY existirem, um ping na API REST reforça. Ver docs/BACKUP.md.
# O log deste repositório é público: só contagens são impressas (nunca dados, endereços ou senhas).
on:
  schedule:
    - cron: '30 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-supabase
  cancel-in-progress: false

jobs:
  espelho:
    name: pg_dump (Neon) → restaurar no Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL_BACKUP: ${{ secrets.DATABASE_URL_BACKUP }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - name: Conferir configuração
        id: cfg
        run: |
          if [ -z "$DATABASE_URL_BACKUP" ] || [ -z "$SUPABASE_DB_URL" ]; then
            echo "::notice::DATABASE_URL_BACKUP ou SUPABASE_DB_URL não configurados: nada a fazer (ver docs/BACKUP.md)."
            echo "pronto=false" >> "$GITHUB_OUTPUT"
          else
            echo "pronto=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Dump do Neon (somente leitura)
        if: steps.cfg.outputs.pronto == 'true'
        run: |
          mkdir -p out
          docker run --rm -e DATABASE_URL_BACKUP postgres:17 \
            sh -c 'pg_dump "$DATABASE_URL_BACKUP" --format=custom --compress=9 --no-owner --no-privileges' > out/radar.dump
          size=$(stat -c %s out/radar.dump)
          echo "Dump: $size bytes"
          if [ "$size" -lt 20000 ]; then echo "::error::Dump suspeito (tamanho $size)"; exit 1; fi
          docker run --rm -v "$PWD/out:/out" postgres:17 pg_restore --list /out/radar.dump > out/conteudo.txt
          for t in oportunidades oportunidades_historico opcoes usuarios; do
            grep -q "TABLE public $t " out/conteudo.txt || { echo "::error::Tabela $t ausente no dump"; exit 1; }
          done
          # Tabelas do Radar que o dump contém (para a guarda do destino)
          grep -E ' TABLE public ' out/conteudo.txt | awk '{print $6}' | sort -u > out/tabelas.txt
          echo "Tabelas no dump: $(grep -c '' out/tabelas.txt)"
          echo "select count(*) from oportunidades;" > out/c.sql
          docker run --rm -e DATABASE_URL_BACKUP -v "$PWD/out:/out:ro" postgres:17 sh -c 'psql "$DATABASE_URL_BACKUP" -At -f /out/c.sql' > out/origem.txt
          echo "Oportunidades na origem: $(cat out/origem.txt)"

      - name: Guarda do destino (só restaura em projeto dedicado ao Radar)
        if: steps.cfg.outputs.pronto == 'true'
        run: |
          # Recusa se o schema public do Supabase tiver tabelas que não são do Radar (ex.: outro app no mesmo projeto).
          echo "select tablename from pg_tables where schemaname = 'public' order by 1;" > out/q.sql
          docker run --rm -e SUPABASE_DB_URL -v "$PWD/out:/out:ro" postgres:17 sh -c 'psql "$SUPABASE_DB_URL" -At -f /out/q.sql' | sort -u > out/destino.txt
          outras=$(comm -23 out/destino.txt out/tabelas.txt | grep -c '' || true)
          if [ "${outras:-0}" -gt 0 ]; then
            echo "::error::O schema public do Supabase tem $outras tabela(s) que não são do Radar. Use um projeto dedicado (ver docs/BACKUP.md)."
            exit 1
          fi
          echo "Destino ok (sem tabelas de outros apps)."

      - name: Restaurar no Supabase
        if: steps.cfg.outputs.pronto == 'true'
        run: |
          docker run --rm -e SUPABASE_DB_URL -v "$PWD/out:/out:ro" postgres:17 \
            sh -c 'pg_restore --clean --if-exists --no-owner --no-privileges --dbname "$SUPABASE_DB_URL" /out/radar.dump' 2> out/restore.err || true
          echo "Mensagens do pg_restore: $(grep -c '' out/restore.err)"
          destino=$(docker run --rm -e SUPABASE_DB_URL -v "$PWD/out:/out:ro" postgres:17 sh -c 'psql "$SUPABASE_DB_URL" -At -f /out/c.sql')
          origem=$(cat out/origem.txt)
          echo "Oportunidades: origem $origem, destino $destino"
          dif=$(( origem > destino ? origem - destino : destino - origem ))
          # Tolerância pequena: pode haver cadastros entre o dump e a contagem.
          if [ -z "$destino" ] || [ "$destino" -eq 0 ] || [ "$dif" -gt 10 ]; then
            echo "::error::Espelho do Supabase não confere com a origem (origem $origem, destino ${destino:-vazio})."
            exit 1
          fi
          echo "### Espelho no Supabase atualizado: $destino oportunidades" >> "$GITHUB_STEP_SUMMARY"

      - name: Manter o projeto ativo (ping na API REST)
        if: steps.cfg.outputs.pronto == 'true'
        continue-on-error: true
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then echo "Ping opcional não configurado (SUPABASE_URL/SUPABASE_ANON_KEY)."; exit 0; fi
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY" "$SUPABASE_URL/rest/v1/")
          echo "Ping REST: HTTP $code"
