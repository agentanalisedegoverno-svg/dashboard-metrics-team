name: Testes de carga e segurança

# Rotina semanal (e sob demanda) dos testes que não rodam a cada PR: carga/desempenho do banco e da API, sondagem de
# segurança do site em produção (de fora, como um desconhecido na internet) e latência do banco real.
# Os testes de regressão, de segurança estática e do banco já rodam em todo PR (workflow CI). Ver docs/TESTES.md.
on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      url:
        description: 'Endereço do Radar a sondar (vazio = produção)'
        required: false
        default: ''
      fator:
        description: 'Multiplicador dos orçamentos de tempo (2 = o dobro de folga)'
        required: false
        default: '2'

permissions:
  contents: read

concurrency:
  group: testes-nao-funcionais
  cancel-in-progress: false

jobs:
  carga:
    name: Carga e desempenho (banco e API)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BUDGET_FATOR: ${{ inputs.fator || '2' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:carga
      - name: Resumo
        if: always()
        run: |
          {
            echo "### Carga e desempenho"
            for f in test-results/carga-banco.json test-results/carga-api.json; do
              [ -f "$f" ] && node -e "const r=require('./$f');console.log('\n**$f**\n\n| Teste | Tempo (ms) | Orçamento (ms) | Detalhe |\n|---|---:|---:|---|');for(const x of r)console.log('| '+x.teste+' | '+x.ms+' | '+x.orcamento+' | '+x.detalhe+' |')"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: resultados-carga
          path: test-results/carga-*.json
          retention-days: 30

  seguranca-externa:
    name: Sondagem de segurança do site (de fora)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Sondar
        env:
          ALVO: ${{ inputs.url }}
        run: |
          set -o pipefail
          node scripts/teste-seguranca-externa.mjs ${ALVO:+"$ALVO"} | tee sondagem.txt
          { echo '### Sondagem de segurança externa'; echo '```'; tail -n 3 sondagem.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  latencia-banco:
    name: Latência do banco real (somente leitura)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL_BACKUP }}
    steps:
      - name: Conferir segredo
        id: cfg
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "::notice::DATABASE_URL_BACKUP ausente: medição pulada."; echo "pronto=false" >> "$GITHUB_OUTPUT"; else echo "pronto=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.cfg.outputs.pronto == 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.cfg.outputs.pronto == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
        if: steps.cfg.outputs.pronto == 'true'
      - name: Medir
        if: steps.cfg.outputs.pronto == 'true'
        run: |
          set -o pipefail
          node scripts/medir-banco.mjs --requisicoes 15 --simultaneas 1,5 | tee latencia.txt
          { echo '### Latência do banco (a partir do GitHub Actions)'; echo '```'; cat latencia.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  desempenho-front:
    name: Desempenho do front (Playwright serial)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BUDGET_FATOR: ${{ inputs.fator || '2' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Instalar Chromium para medições reproduzíveis
        run: npx playwright install --with-deps chromium
      - name: Medir navegação, virtualização, busca, filtros, memória e peso do JavaScript
        run: npm run test:desempenho
      - name: Publicar relatório do navegador
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: resultados-desempenho-front
          path: |
            playwright-report/
            test-results/
          retention-days: 30
