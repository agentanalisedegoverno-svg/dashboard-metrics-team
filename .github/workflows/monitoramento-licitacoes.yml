name: Monitoramento de licitações

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Máximo de processos por execução (1–100)'
        required: false
        default: '30'
        type: string

permissions:
  contents: read

concurrency:
  group: monitoramento-licitacoes
  cancel-in-progress: false

jobs:
  consultar-fontes:
    # A agenda fica protegida até a migração e a credencial restrita estarem preparadas.
    if: github.event_name == 'workflow_dispatch' || vars.MONITOR_LICITACOES_ENABLED == 'true'
    name: Consultar fontes públicas vinculadas
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Consultar processos vencidos
        env:
          DATABASE_URL_MONITOR: ${{ secrets.DATABASE_URL_MONITOR }}
          MONITOR_BATCH_SIZE: ${{ inputs.batch_size || '30' }}
        run: |
          if [ -z "$DATABASE_URL_MONITOR" ]; then
            echo "::error::Configure o secret DATABASE_URL_MONITOR com usuário de banco restrito ao módulo de monitoramento."
            exit 1
          fi
          node scripts/monitor-licitacoes.mjs
